version: '3.8'

services:
  cv_platform:
    build: .
    container_name: cv_security_system
    restart: unless-stopped
    ports:
      - "5000:5000"

    # --- GPU ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # --- Доступ к камерам (USB/V4L2) ---
    # Раскомментируйте нужные устройства:
    devices:
      - /dev/video0:/dev/video0   # Камера 0
      # - /dev/video1:/dev/video1 # Камера 1 (если есть)

    # --- Хранение данных ---
    volumes:
      - ./known_faces:/app/known_faces
      - ./config.json:/app/config.json
      - ./platform_data.db:/app/platform_data.db
      - ./clips:/app/clips
      - ./zones.json:/app/zones.json
      - ./.flask_secret:/app/.flask_secret

    environment:
      - PYTHONUNBUFFERED=1
      # Можно задать SECRET_KEY явно:
      # - SECRET_KEY=your_very_long_secret_key_here